<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Panayotis Kola</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b14">
<link rel="icon" type="image/png" href="/assets/img/logo-96.png">
<script>
  (function () {
    var t = null, l = null;
    try { t = localStorage.getItem('pk-theme'); l = localStorage.getItem('pk-lang'); } catch (e) {}
    if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    if (!l) l = ((navigator.language || 'en').toLowerCase().indexOf('el') === 0) ? 'el' : 'en';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('lang', l);
  })();
</script>
<link rel="preload" href="/assets/fonts/commissioner-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css?v=12">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .nf { width: min(640px, 100%); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
        background: color-mix(in srgb, #050912 90%, transparent); box-shadow: var(--shadow); }
  .nf pre { font-family: var(--mono); font-size: 14px; line-height: 1.8; color: #c9d4e5; padding: 20px 22px 8px; white-space: pre-wrap; word-break: break-word; }
  .nf .ps { color: #4ade80; font-weight: 700; }
  .nf .bad { color: #f87171; }
  .nf .dim { color: #8a97ad; }
  .nf .win-bar > span:nth-child(1) { background: #f87171; }
  .nf .win-bar > span:nth-child(2) { background: #fbbf24; }
  .nf .win-bar > span:nth-child(3) { background: #4ade80; }
  .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 22px 24px; }
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<main class="nf">
  <div class="win-bar"><span></span><span></span><span></span><em>pkola@lab: ~</em></div>
  <pre><span class="ps">pkola@lab:~$</span> cd <span id="path"></span>
<span class="bad" id="msg"></span>
<span class="dim" id="hint"></span></pre>
  <div class="nf-actions"><a class="btn btn-primary" href="/" id="home"></a></div>
</main>
<script>
  (function () {
    var el = document.documentElement.getAttribute('lang') === 'el';
    var path = location.pathname + location.search;
    document.getElementById('path').textContent = path;
    document.getElementById('msg').textContent = el
      ? 'bash: cd: ' + path + ': Δεν υπάρχει τέτοιο αρχείο ή κατάλογος (404)'
      : 'bash: cd: ' + path + ': No such file or directory (404)';
    document.getElementById('hint').textContent = el
      ? '# Η σελίδα που ζήτησες δεν υπάρχει ή μετακινήθηκε.'
      : '# The page you asked for does not exist or has moved.';
    document.getElementById('home').textContent = el ? 'Πίσω στην αρχική' : 'Back to the home page';
    document.title = el ? '404 — Παναγιώτης Κόλα' : '404 — Panayotis Kola';
  })();
</script>
</body>
</html>
